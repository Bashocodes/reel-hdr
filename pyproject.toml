[project]
name = "reel-hdr"
version = "0.1.0a0"
description = "Local Dolby Vision reel conversion and conformance tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
]

[project.scripts]
reelhdr = "reelhdr.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelhdr"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: exercises locally installed video tools and may be skipped",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
