name: Feature request
description: Propose a bounded conversion, verification, or CLI improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow or evidence gap should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include expected CLI and report behavior where applicable.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Conversion pipeline
        - Verification
        - Presets
        - Doctor / external tools
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: standards
    attributes:
      label: Standards or primary references
      description: Link authoritative specifications or upstream tool documentation.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not require committing media.
          required: true
        - label: This proposal does not introduce creative grading defaults.
          required: true
