name: New check or preset
description: Propose a verification check or neutral conversion preset.
title: "[Check/Preset]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: contribution-type
    attributes:
      label: Contribution type
      options:
        - Verification check
        - Conversion preset
    validations:
      required: true
  - type: input
    id: stable-id
    attributes:
      label: Proposed stable ID
      placeholder: video.chroma_subsampling or high-quality-hlg
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Evidence or output contract
      description: State what is found/expected or which neutral defaults are selected.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Synthetic test plan
      description: Cover success, failure/override behavior, and malformed evidence where relevant.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: The proposal uses no private media or private source identifiers.
          required: true
        - label: The proposal makes no platform-success guarantee.
          required: true
        - label: The proposal contains no creative look or grading policy.
          required: true
